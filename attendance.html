<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Club Directory</title>
    <link rel ="stylesheet" href ="directory.css">
</head>
<body>
    <section class ="header" class ="header">
        <div class ="header-main" class ="header-main">
            <h1>Southport Key Club Directory</h1>
            <p>View points, hours, attendance, and fee payment.</p>
    
        </div>
        

        <div class ="select-directory-tab">
            <a href ="index.html" class ="directory-tab-option"> Hours and Points</a>
            <a href ="memberFee.html" class ="directory-tab-option"> Member fees</a>
            <a href ="attendance.html" class ="directory-tab-option">Attendance Log</a>
        </div>
    </section>

    


    <section class ="main-directory" class ="main-directory">
        <div class ="tab-type">
            <h2>You are currently viewing attendance logs</h2>
        </div>
        <div class ="search">
            <input class ="search-bar">
            <button class ="enter-search">Enter</button>
        </div>
        
        <button class ="add-student" id ="add-event-button">
            Add New Event
        </button>

        <!-- Add Event Modal -->
        <div class="modal-overlay" id="add-event-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add New Event</h2>
                    <button class="modal-close" id="event-modal-close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <form class="add-event-form" id="add-event-form">
                        <div class="form-group">
                            <label for="event-name">Event Name</label>
                            <input type="text" id="event-name" name="event-name" required placeholder="Enter event name">
                            <span class="error-message" id="event-name-error"></span>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="event-date">Date</label>
                                <input type="date" id="event-date" name="event-date" required>
                                <span class="error-message" id="event-date-error"></span>
                            </div>
                            <div class="form-group">
                                <label for="event-time">Time</label>
                                <input type="time" id="event-time" name="event-time" required>
                                <span class="error-message" id="event-time-error"></span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="event-type">Event Type</label>
                            <select id="event-type" name="event-type" required>
                                <option value="">Select type</option>
                                <option value="meeting">Meeting</option>
                                <option value="service">Service</option>
                            </select>
                            <span class="error-message" id="event-type-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="event-description">Description</label>
                            <textarea id="event-description" name="event-description" rows="3" placeholder="Enter event description (optional)"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="event-location">Location</label>
                            <input type="text" id="event-location" name="event-location" placeholder="Enter location (optional)">
                        </div>
                        <div class="modal-actions">
                            <button type="button" class="btn-cancel" id="event-modal-cancel-btn">Cancel</button>
                            <button type="submit" class="btn-submit">Add Event</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class ="student-info-container">
            <div class ="student-info-bar">
            </div> 
        </div>
    </section>

</body>
</html>
